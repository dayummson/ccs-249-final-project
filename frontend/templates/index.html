<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Project Analyzer</title>
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='dist/output.css') }}"
        />
    </head>
    <body class="bg-zinc-50 text-[13px] text-zinc-700 font-sans">
        <main class="min-h-screen">
            <div class="px-6 pt-6">
                <div class="text-[12px] text-zinc-400">Project Analyzer</div>
                <div class="text-[11px] text-zinc-400">
                    Upload an activity sheet to generate your task list.
                </div>
            </div>

            <div class="px-6 mt-10">
                <div class="mx-auto w-full max-w-2xl">
                    <div
                        id="uploadCard"
                        class="flex flex-col items-center justify-center gap-2 rounded-lg border border-dashed border-zinc-200 bg-white px-8 py-10 text-center hover:border-zinc-300"
                    >
                        <svg
                            class="h-4 w-4 text-zinc-400"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.5"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="M12 16V4" />
                            <path d="M8 8l4-4 4 4" />
                            <path
                                d="M20 16.5a4.5 4.5 0 0 0-4.5-4.5h-7A4.5 4.5 0 0 0 4 16.5"
                            />
                        </svg>
                        <div class="text-[13px] text-zinc-500">
                            Drag and drop a file, or click to browse
                        </div>
                        <div class="text-[11px] text-zinc-400">
                            Accepts .docx and .pdf only
                        </div>
                    </div>

                    <input
                        id="fileInput"
                        type="file"
                        class="hidden"
                        accept=".docx,.pdf"
                    />

                    <div id="loadingState" class="mt-4 hidden">
                        <div class="h-1 w-full bg-zinc-200">
                            <div
                                class="h-1 w-1/3 bg-zinc-400 animate-pulse"
                            ></div>
                        </div>
                    </div>

                    <div
                        id="errorMessage"
                        class="mt-3 hidden text-[11px] text-amber-700"
                    ></div>

                    <section id="resultsSection" class="mt-8 hidden">
                        <div class="h-0.5 w-full bg-zinc-200">
                            <div
                                id="progressFill"
                                class="h-0.5 w-0 bg-slate-500"
                            ></div>
                        </div>

                        <div
                            id="legend"
                            class="mt-6 mb-6 flex flex-wrap items-center justify-center gap-6"
                        ></div>

                        <div
                            id="categories"
                            class="divide-y divide-zinc-100 border-t border-zinc-100"
                        ></div>

                        <div
                            id="completionSummary"
                            class="mt-6 text-center text-[11px] text-zinc-400"
                        ></div>
                    </section>
                </div>
            </div>
        </main>

        <script>
            const uploadCard = document.getElementById("uploadCard");
            const fileInput = document.getElementById("fileInput");
            const loadingState = document.getElementById("loadingState");
            const errorMessage = document.getElementById("errorMessage");
            const resultsSection = document.getElementById("resultsSection");
            const legend = document.getElementById("legend");
            const categoriesEl = document.getElementById("categories");
            const progressFill = document.getElementById("progressFill");
            const completionSummary =
                document.getElementById("completionSummary");

            const CATEGORY_CONFIG = [
                {
                    key: "TECHNICAL_TASK",
                    label: "Tasks",
                    dotClass: "bg-slate-500",
                },
                {
                    key: "WEIGHTED_PRIORITY",
                    label: "Graded",
                    dotClass: "bg-amber-600",
                },
                {
                    key: "PRE_REQUISITE",
                    label: "Do First",
                    dotClass: "bg-blue-400",
                },
                {
                    key: "OPTIONAL_BONUS",
                    label: "Bonus",
                    dotClass: "bg-violet-400",
                },
                {
                    key: "ADMIN_TRAP",
                    label: "Admin",
                    dotClass: "bg-zinc-400",
                },
            ];

            const normalizeText = (text) => (text || "").trim();

            const hashText = (text) => {
                let hash = 0;
                for (let i = 0; i < text.length; i += 1) {
                    hash = (hash << 5) - hash + text.charCodeAt(i);
                    hash |= 0;
                }
                return `task-${Math.abs(hash)}`;
            };

            const getStoredCheck = (text) => {
                const key = hashText(text);
                return localStorage.getItem(key) === "1";
            };

            const setStoredCheck = (text, isChecked) => {
                const key = hashText(text);
                localStorage.setItem(key, isChecked ? "1" : "0");
            };

            const clearDisplay = () => {
                errorMessage.classList.add("hidden");
                errorMessage.textContent = "";
                resultsSection.classList.add("hidden");
                legend.classList.add("hidden");
                legend.innerHTML = "";
                categoriesEl.innerHTML = "";
                completionSummary.textContent = "";
                progressFill.style.width = "0%";
            };

            const showLoading = () => {
                loadingState.classList.remove("hidden");
            };

            const hideLoading = () => {
                loadingState.classList.add("hidden");
            };

            const showError = (message) => {
                errorMessage.textContent = message;
                errorMessage.classList.remove("hidden");
            };

            const updateOverallProgress = (items) => {
                const total = items.length;
                const completed = items.filter((item) => item.checked).length;
                const percent = total === 0 ? 0 : (completed / total) * 100;
                progressFill.style.width = `${percent}%`;
                completionSummary.textContent = `${completed} of ${total} tasks completed`;
            };

            const buildLegend = () => {
                legend.innerHTML = "";
                CATEGORY_CONFIG.forEach((category) => {
                    const pill = document.createElement("div");
                    pill.className =
                        "inline-flex items-center gap-2 text-[11px] text-zinc-500";

                    const dot = document.createElement("span");
                    dot.className = `h-1 w-1 rounded-full ${category.dotClass}`;

                    const label = document.createElement("span");
                    label.textContent = category.label;

                    pill.appendChild(dot);
                    pill.appendChild(label);
                    legend.appendChild(pill);
                });
            };

            const createChevron = () => {
                const chevron = document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "svg",
                );
                chevron.setAttribute("viewBox", "0 0 20 20");
                chevron.setAttribute("fill", "none");
                chevron.setAttribute("stroke", "currentColor");
                chevron.setAttribute("stroke-width", "1.5");
                chevron.setAttribute("stroke-linecap", "round");
                chevron.setAttribute("stroke-linejoin", "round");
                chevron.classList.add("h-3", "w-3", "text-zinc-400");

                const path = document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "path",
                );
                path.setAttribute("d", "M6 8l4 4 4-4");
                chevron.appendChild(path);

                return chevron;
            };

            const setExpanded = (content, chevron, isExpanded) => {
                if (isExpanded) {
                    content.classList.remove("opacity-0");
                    content.classList.add("opacity-100");
                    content.style.maxHeight = `${content.scrollHeight}px`;
                    if (chevron) {
                        chevron.classList.add("rotate-180");
                    }
                } else {
                    content.classList.remove("opacity-100");
                    content.classList.add("opacity-0");
                    content.style.maxHeight = "0px";
                    if (chevron) {
                        chevron.classList.remove("rotate-180");
                    }
                }
            };

            const renderTask = (text, itemsState) => {
                const trimmedText = normalizeText(text);
                const isLong = trimmedText.length > 72;
                const wrapper = document.createElement("div");
                wrapper.className = "";

                const row = document.createElement("div");
                row.className = "flex items-center gap-3";

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.className =
                    "h-3.5 w-3.5 rounded border-zinc-300 text-slate-600 focus:ring-0";

                const preview = document.createElement("div");
                preview.className = "flex-1 min-w-0";

                const previewText = document.createElement("div");
                previewText.className = "truncate text-[13px]";
                previewText.textContent = trimmedText;

                preview.appendChild(previewText);

                let expandButton = null;
                let expandedBlock = null;

                if (isLong) {
                    expandButton = document.createElement("button");
                    expandButton.type = "button";
                    expandButton.className =
                        "ml-2 flex h-5 w-5 items-center justify-center text-zinc-400";

                    const chevron = createChevron();
                    chevron.classList.add(
                        "transition-transform",
                        "duration-150",
                    );
                    expandButton.appendChild(chevron);

                    expandedBlock = document.createElement("div");
                    expandedBlock.className =
                        "overflow-hidden text-[12px] text-zinc-400 transition-[max-height,opacity] duration-150 opacity-0";
                    expandedBlock.textContent = trimmedText;
                    expandedBlock.style.maxHeight = "0px";

                    let isExpanded = false;
                    expandButton.addEventListener("click", () => {
                        isExpanded = !isExpanded;
                        setExpanded(expandedBlock, chevron, isExpanded);
                    });
                }

                const isChecked = getStoredCheck(trimmedText);
                checkbox.checked = isChecked;
                if (isChecked) {
                    previewText.classList.add("line-through", "text-zinc-400");
                }

                checkbox.addEventListener("change", () => {
                    previewText.classList.toggle(
                        "line-through",
                        checkbox.checked,
                    );
                    previewText.classList.toggle(
                        "text-zinc-400",
                        checkbox.checked,
                    );
                    setStoredCheck(trimmedText, checkbox.checked);
                    const itemState = itemsState.find(
                        (item) => item.text === trimmedText,
                    );
                    if (itemState) {
                        itemState.checked = checkbox.checked;
                    }
                    updateOverallProgress(itemsState);
                });

                row.appendChild(checkbox);
                row.appendChild(preview);
                if (expandButton) {
                    row.appendChild(expandButton);
                }

                wrapper.appendChild(row);
                if (expandedBlock) {
                    expandedBlock.classList.add("mt-1");
                    wrapper.appendChild(expandedBlock);
                }

                return { element: wrapper, checked: checkbox.checked };
            };

            const renderCategory = (category, items, itemsState) => {
                const section = document.createElement("div");
                section.className = "py-4";

                const header = document.createElement("button");
                header.type = "button";
                header.className = "flex w-full items-center gap-3 text-left";

                const dot = document.createElement("span");
                dot.className = `h-1.5 w-1.5 rounded-full ${category.dotClass}`;

                const label = document.createElement("span");
                label.className =
                    "text-[11px] uppercase tracking-wide text-zinc-500";
                label.textContent = category.label;

                const completion = document.createElement("span");
                completion.className = "ml-auto text-[11px] text-zinc-400";
                const total = items.length;
                const completed = items.filter((item) => item.checked).length;
                completion.textContent = `${completed} / ${total}`;

                const chevron = createChevron();
                chevron.classList.add("transition-transform", "duration-150");

                header.appendChild(dot);
                header.appendChild(label);
                header.appendChild(completion);
                header.appendChild(chevron);

                const content = document.createElement("div");
                content.className =
                    "mt-3 overflow-hidden transition-[max-height,opacity] duration-150 opacity-0";
                content.style.maxHeight = "0px";

                if (items.length === 0) {
                    const empty = document.createElement("div");
                    empty.className = "text-[12px] italic text-zinc-400";
                    empty.textContent = "Nothing here";
                    content.appendChild(empty);
                } else {
                    const list = document.createElement("div");
                    list.className = "space-y-3";
                    items.forEach((item) => {
                        list.appendChild(item.element);
                    });
                    content.appendChild(list);
                }

                let expanded = items.length > 0;
                setExpanded(content, chevron, expanded);

                header.addEventListener("click", () => {
                    expanded = !expanded;
                    setExpanded(content, chevron, expanded);
                });

                const updateCompletion = () => {
                    const totalCount = items.length;
                    const completedCount = items.filter(
                        (item) => item.checked,
                    ).length;
                    completion.textContent = `${completedCount} / ${totalCount}`;
                };

                items.forEach((item) => {
                    const checkbox = item.element.querySelector(
                        "input[type='checkbox']",
                    );
                    if (checkbox) {
                        checkbox.addEventListener("change", updateCompletion);
                    }
                });

                section.appendChild(header);
                section.appendChild(content);

                return section;
            };

            const renderResults = (briefing) => {
                categoriesEl.innerHTML = "";
                const itemsState = [];

                CATEGORY_CONFIG.forEach((category) => {
                    const items = (briefing[category.key] || []).map((text) => {
                        const rendered = renderTask(text, itemsState);
                        const entry = {
                            text: normalizeText(text),
                            checked: rendered.checked,
                        };
                        itemsState.push(entry);
                        return rendered;
                    });

                    const section = renderCategory(category, items, itemsState);
                    categoriesEl.appendChild(section);
                });

                buildLegend();
                legend.classList.remove("hidden");
                resultsSection.classList.remove("hidden");

                updateOverallProgress(itemsState);
            };

            const handleFile = async (file) => {
                if (!file) {
                    return;
                }

                clearDisplay();
                showLoading();

                const formData = new FormData();
                formData.append("file", file);

                try {
                    const response = await fetch("/analyze", {
                        method: "POST",
                        body: formData,
                    });

                    const data = await response.json();
                    if (!response.ok) {
                        throw new Error(data.error || "Upload failed.");
                    }

                    renderResults(data.briefing || {});
                } catch (error) {
                    showError(error.message || "Upload failed.");
                } finally {
                    hideLoading();
                }
            };

            uploadCard.addEventListener("click", () => fileInput.click());

            fileInput.addEventListener("change", (event) => {
                const file = event.target.files[0];
                handleFile(file);
            });

            uploadCard.addEventListener("dragover", (event) => {
                event.preventDefault();
            });

            uploadCard.addEventListener("drop", (event) => {
                event.preventDefault();
                const file = event.dataTransfer.files[0];
                handleFile(file);
            });
        </script>
    </body>
</html>
